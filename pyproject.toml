[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "esaalat"
version = "0.1.0"
description = "Server-side Esaalat client: locked checkout sessions, payment intents and signed webhook verification."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Esaalat", email = "support@esaalat.com" }]
keywords = ["esaalat", "payments", "checkout", "webhook", "yemen"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.urls]
Homepage = "https://esaalat.com/en/sdk"
Documentation = "https://esaalat.com/en/api-reference"
Source = "https://github.com/Esaalat/esaalat-python"

[tool.setuptools.packages.find]
include = ["esaalat*"]

[tool.setuptools.package-data]
esaalat = ["py.typed"]
